<rect y="61" width="70" height="2" fill="url(#glint)" opacity=".9"><animate attributeName="x" values="289;70" dur="3.6s" begin="0.8999999999999999s" repeatCount="indefinite"/></rect>
<rect y="61" width="70" height="2" fill="url(#glint)" opacity=".9"><animate attributeName="x" values="841;1060" dur="3.6s" begin="0.8999999999999999s" repeatCount="indefinite"/></rect>
<text x="600" y="74" text-anchor="middle" class="s" font-size="31" font-weight="800" fill="url(#title)" textLength="414" lengthAdjust="spacing">GITHUB TELEMETRY</text>
<text x="486.9" y="104" class="m" font-size="13" fill="#6e7781" textLength="226.2" lengthAdjust="spacingAndGlyphs" >live stats, regenerated daily</text>
