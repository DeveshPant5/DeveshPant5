<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="svg-title">
<title id="svg-title">05 — Contribution grid</title>
<style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}</style>
<defs>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset=".55" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="railL" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="345.5" y2="0"><stop offset="0" stop-color="#0891b2" stop-opacity="0"/><stop offset="1" stop-color="#0891b2" stop-opacity=".9"/></linearGradient>
<linearGradient id="railR" gradientUnits="userSpaceOnUse" x1="854.5" y1="0" x2="1130" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity=".9"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4" stop-opacity="0"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feComponentTransfer in="b" result="bb"><feFuncA type="linear" slope="0.8"/></feComponentTransfer><feMerge><feMergeNode in="bb"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="530.7" y="30" class="m" font-size="11" fill="#0891b2" textLength="138.6" lengthAdjust="spacing" opacity=".9">SECTION 05 / 06</text>
<line x1="70" y1="62" x2="345.5" y2="62" stroke="url(#railL)" stroke-width="1.5"/>
<line x1="854.5" y1="62" x2="1130" y2="62" stroke="url(#railR)" stroke-width="1.5"/>
<g fill="none" stroke-width="1.5"><path d="M349.5 62l6-6 6 6-6 6z" stroke="#0891b2"/><path d="M838.5 62l6-6 6 6-6 6z" stroke="#7c3aed"/></g>
<g stroke="#d0d7de" stroke-width="1"><line x1="285.5" y1="56" x2="285.5" y2="68"/><line x1="914.5" y1="56" x2="914.5" y2="68"/><line x1="275.5" y1="56" x2="275.5" y2="68"/><line x1="924.5" y1="56" x2="924.5" y2="68"/><line x1="265.5" y1="56" x2="265.5" y2="68"/><line x1="934.5" y1="56" x2="934.5" y2="68"/><line x1="255.5" y1="56" x2="255.5" y2="68"/><line x1="944.5" y1="56" x2="944.5" y2="68"/></g>
<rect y="61" width="70" height="2" fill="url(#glint)" opacity=".9"><animate attributeName="x" values="275.5;70" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></rect>
<rect y="61" width="70" height="2" fill="url(#glint)" opacity=".9"><animate attributeName="x" values="854.5;1060" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="600" y="74" text-anchor="middle" class="s" font-size="31" font-weight="800" fill="url(#title)" textLength="441" lengthAdjust="spacing">CONTRIBUTION GRID</text>
<text x="483" y="104" class="m" font-size="13" fill="#6e7781" textLength="234" lengthAdjust="spacingAndGlyphs" >watch the snake eat my commits</text>
